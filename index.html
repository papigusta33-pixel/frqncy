<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FRQNCY - Web App</title>
  <style>
    :root {
      --bg-color: #08080a;
      --card-bg: #121319;
      --border-color: rgba(255, 255, 255, 0.08);
      --accent-color: #ffffff;
      --text-muted: #8a8f9d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .app-header {
      height: 65px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      background: rgba(8, 8, 10, 0.9);
    }

    .dropdown-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 14px 6px 6px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-color);
    }

    .brand-title { font-size: 0.95rem; font-weight: 700; letter-spacing: 2px; }

    .nav-links { display: flex; gap: 24px; list-style: none; }
    .nav-links a { color: var(--text-muted); text-decoration: none; font-size: 0.85rem; }
    .nav-links a.active { color: var(--accent-color); }

    .app-main { flex: 1; display: grid; grid-template-columns: 220px 1fr; overflow: hidden; }

    .sidebar {
      border-right: 1px solid var(--border-color);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .sidebar-item {
      color: var(--text-muted);
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.88rem;
    }

    .sidebar-item.active { background: rgba(255, 255, 255, 0.08); color: var(--accent-color); }

    .content-area { padding: 32px; overflow-y: auto; }
    .content-title { font-size: 1.3rem; margin-bottom: 24px; }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 24px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .card:hover, .card.playing { border-color: #ffffff; }

    .card-cover {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 10px;
      background-size: cover;
      background-position: center;
    }

    .card-title { font-size: 0.95rem; font-weight: 600; }
    .card-subtitle { font-size: 0.8rem; color: var(--text-muted); }

    .app-footer {
      height: 85px;
      background: #111217;
      border-top: 1px solid var(--border-color);
      padding: 0 28px;
      display: grid;
      grid-template-columns: 250px 1fr 250px;
      align-items: center;
    }

    .track-info { display: flex; align-items: center; gap: 12px; }
    .track-thumb { width: 44px; height: 44px; border-radius: 8px; background-size: cover; background-color: #222; }

    .player-center { display: flex; flex-direction: column; align-items: center; gap: 8px; }

    .play-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #ffffff;
      border: none;
      color: #000;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #visualizer { width: 100%; height: 28px; }
    .status-text { font-size: 0.8rem; color: var(--text-muted); text-align: right; }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="dropdown-btn">
      <span class="brand-title">FRQNCY</span>
    </div>
    <ul class="nav-links">
      <li><a href="#" class="active">Discover</a></li>
      <li><a href="#">Frequencies</a></li>
      <li><a href="#">Mixes</a></li>
    </ul>
  </header>

  <main class="app-main">
    <aside class="sidebar">
      <div class="sidebar-item active">Home</div>
      <div class="sidebar-item">Recent Tracks</div>
      <div class="sidebar-item">Favorites</div>
    </aside>

    <section class="content-area">
      <h2 class="content-title">Trending Channels</h2>
      <div class="dashboard-grid" id="channelGrid"></div>
    </section>
  </main>

  <footer class="app-footer">
    <div class="track-info">
      <div class="track-thumb" id="currentThumb"></div>
      <div>
        <h4 id="currentTitle" style="font-size: 0.88rem;">Select a channel</h4>
        <p id="currentSub" style="font-size: 0.78rem; color: var(--text-muted);">Click to play sound</p>
      </div>
    </div>

    <div class="player-center">
      <button class="play-btn" id="togglePlay"></button>
      <canvas id="visualizer"></canvas>
    </div>

    <div class="status-text" id="statusText">STOPPED</div>
  </footer>

  <script>
    const channels = [
      { id: 1, title: "Deep Frequencies", subtitle: "432 Hz Healing Tone", freq: 432, cover: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=400&q=80" },
      { id: 2, title: "Resonance Delta", subtitle: "528 Hz Love Frequency", freq: 528, cover: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=400&q=80" },
      { id: 3, title: "Synth Waveform", subtitle: "220 Hz Binaural Pulse", freq: 220, cover: "https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?w=400&q=80" },
      { id: 4, title: "Low-Fi Ambient", subtitle: "174 Hz Solfeggio Tone", freq: 174, cover: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=400&q=80" }
    ];

    let audioCtx = null;
    let oscillator = null;
    let gainNode = null;
    let isPlaying = false;
    let currentChannel = null;

    const playBtn = document.getElementById('togglePlay');
    const playIcon = `<svg width="14" height="16" viewBox="0 0 14 16" fill="currentColor"><path d="M0 0L14 8L0 16V0Z"/></svg>`;
    const pauseIcon = `<svg width="12" height="16" viewBox="0 0 12 16" fill="currentColor"><rect width="4" height="16" rx="1"/><rect x="8" width="4" height="16" rx="1"/></svg>`;
    playBtn.innerHTML = playIcon;

    const grid = document.getElementById('channelGrid');

    channels.forEach(ch => {
      const card = document.createElement('div');
      card.className = 'card';
      card.id = `card-${ch.id}`;
      card.innerHTML = `
        <div class="card-cover" style="background-image: url('${ch.cover}')"></div>
        <div class="card-title">${ch.title}</div>
        <div class="card-subtitle">${ch.subtitle}</div>
      `;
      card.addEventListener('click', () => startFrequency(ch));
      grid.appendChild(card);
    });

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function startFrequency(ch) {
      initAudio();
      stopFrequency();

      currentChannel = ch;
      document.querySelectorAll('.card').forEach(c => c.classList.remove('playing'));
      document.getElementById(`card-${ch.id}`).classList.add('playing');

      document.getElementById('currentTitle').textContent = ch.title;
      document.getElementById('currentSub').textContent = ch.subtitle;
      document.getElementById('currentThumb').style.backgroundImage = `url('${ch.cover}')`;

      oscillator = audioCtx.createOscillator();
      gainNode = audioCtx.createGain();

      oscillator.type = 'sine';
      oscillator.frequency.setValueAtTime(ch.freq, audioCtx.currentTime);
      
      // Soft volume
      gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);

      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      oscillator.start();
      isPlaying = true;
      playBtn.innerHTML = pauseIcon;
      document.getElementById('statusText').textContent = `PLAYING ${ch.freq}Hz`;
    }

    function stopFrequency() {
      if (oscillator) {
        oscillator.stop();
        oscillator.disconnect();
        oscillator = null;
      }
      isPlaying = false;
      playBtn.innerHTML = playIcon;
      document.getElementById('statusText').textContent = "STOPPED";
    }

    playBtn.addEventListener('click', () => {
      if (isPlaying) {
        stopFrequency();
      } else {
        startFrequency(currentChannel || channels[0]);
      }
    });

    // Animated Visualizer
    const canvas = document.getElementById('visualizer');
    const ctx = canvas.getContext('2d');

    function drawVisualizer() {
      canvas.width = canvas.clientWidth;
      canvas.height = canvas.clientHeight;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const bars = 25;
      const barWidth = canvas.width / bars - 2;

      for (let i = 0; i < bars; i++) {
        const height = isPlaying ? Math.random() * (canvas.height - 4) + 4 : 2;
        ctx.fillStyle = isPlaying ? '#ffffff' : 'rgba(255, 255, 255, 0.2)';
        ctx.fillRect(i * (barWidth + 2), canvas.height - height, barWidth, height);
      }

      requestAnimationFrame(drawVisualizer);
    }

    drawVisualizer();
  </script>
</body>
</html>
